<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация - Plantique</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <div class="conteiner-img">
    <header>
      <div class="header-container">
        <div class="header-left">
          <a href="../index.html" style="text-decoration: none;">
            <img src="../img/logo.png" alt="Logo" />
          </a>
        </div>
        <div class="header-right">
          <a href="login.html" style="text-decoration: none;">
            <button class="transparent-btn">Уже есть аккаунт</button>
          </a>
        </div>
      </div>
    </header>

    <div class="auth-page">
      <div class="auth-container fade-in">
        <div class="auth-header">
          <h1>Создать аккаунт</h1>
          <p>Присоединяйтесь к Plantique</p>
        </div>

        <form class="auth-form" id="registerForm" onsubmit="return handleRegister(event)">
          <div class="form-group">
            <label for="name">Имя</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              placeholder="Ваше имя" 
              required
              autocomplete="name"
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="your@email.com" 
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="password">Пароль</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Минимум 6 символов" 
              required
              minlength="6"
              autocomplete="new-password"
            />
            <span class="password-hint">Минимум 6 символов</span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Подтвердите пароль</label>
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword" 
              placeholder="Повторите пароль" 
              required
              autocomplete="new-password"
            />
          </div>

          <div class="auth-error" id="authError" style="display: none;"></div>

          <button type="submit" class="auth-btn primary">Зарегистрироваться</button>

          <div class="auth-divider">или</div>

          <button type="button" class="auth-btn secondary" onclick="window.location.href='login.html'">
            Уже есть аккаунт? Войти
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="../scripts/auth.js"></script>
  <script>
    // Обработка регистрации
    function handleRegister(event) {
      event.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // Валидация
      if (!name || !email || !password || !confirmPassword) {
        showAuthError('Заполните все поля');
        return false;
      }
      
      if (name.length < 2) {
        showAuthError('Имя должно содержать минимум 2 символа');
        return false;
      }
      
      if (!isValidEmail(email)) {
        showAuthError('Введите корректный email');
        return false;
      }
      
      if (!isValidPassword(password)) {
        showAuthError('Пароль должен содержать минимум 6 символов');
        return false;
      }
      
      if (password !== confirmPassword) {
        showAuthError('Пароли не совпадают');
        return false;
      }
      
      // Регистрация
      register(email, password, name);
      return false;
    }

    // Анимация при загрузке
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(() => {
        document.querySelector('.auth-container').classList.add('visible');
      }, 100);
    });
  </script>

</body>
</html>
