<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход - Plantique</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="conteiner-img">
    <header>
      <div class="header-container">
        <div class="header-left">
          <a href="index.html" style="text-decoration: none;">
            <img src="img/logo.png" alt="Logo" />
          </a>
        </div>
        <div class="header-right">
          <a href="index.html" style="text-decoration: none;">
            <button class="transparent-btn">На главную</button>
          </a>
        </div>
      </div>
    </header>

    <div class="auth-page">
      <div class="auth-container fade-in">
        <div class="auth-header">
          <h1>Добро пожаловать</h1>
          <p>Войдите в свой аккаунт</p>
        </div>

        <form class="auth-form" id="loginForm" onsubmit="return handleLogin(event)">
          <div class="form-group">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="your@email.com" 
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="password">Пароль</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Введите пароль" 
              required
              autocomplete="current-password"
            />
          </div>

          <div class="auth-error" id="authError" style="display: none;"></div>

          <button type="submit" class="auth-btn primary">Войти</button>

          <div class="auth-divider">или</div>

          <button type="button" class="auth-btn secondary" onclick="window.location.href='register.html'">
            Создать аккаунт
          </button>

          <div class="auth-footer">
            <a href="#" class="forgot-password">Забыли пароль?</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Обработка входа
    function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      // Валидация
      if (!email || !password) {
        showAuthError('Заполните все поля');
        return false;
      }
      
      if (!isValidEmail(email)) {
        showAuthError('Введите корректный email');
        return false;
      }
      
      // Вход
      login(email, password);
      return false;
    }

    // Анимация при загрузке
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(() => {
        document.querySelector('.auth-container').classList.add('visible');
      }, 100);
    });
  </script>

</body>
</html>
